<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <meta
      name="description"
      content="This is a Drum Machine built with Web Audio API and uses Keyboard to play the sounds"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./style.css" />
  </head>
  <body>
    <div id="drum-machine">
      <p id="display"></p>
      <div id="pad-bank">
        <button class="drum-pad" >
          Q<audio
            class="clip"
            src="./assets/stab-1.mp3"Q" id="Q"
          ></audio>
        </button>
        <button class="drum-pad">
          W<audio
            class="clip"
            src="./assets/stab-2.mp3"
            id="W"
          ></audio>
        </button>
        <button class="drum-pad">
          E<audio
            class="clip"
            src="./assets/stab-3.mp3"
            id="E"
          ></audio>
        </button>
        <button class="drum-pad">
          A<audio
            class="clip"
            src="./assets/ride.mp3"
            id="A"
          ></audio>
        </button>
        <button class="drum-pad">
          S<audio
            class="clip"
            src="./assets/clap-2.mp3"
            id="S"
          ></audio>
        </button>
        <button class="drum-pad" >
          D<audio
            class="clip"
            src="./assets/snare.mp3"
            id="D"
          ></audio>
        </button>
        <button class="drum-pad">
          Z<audio
            class="clip"
            src="./assets/kick.mp3"
            id="Z"
          ></audio>
        </button>
        <button class="drum-pad">
          X<audio
            class="clip"
            src="./assets/kick-2.mp3"
            id="X"
          ></audio>
        </button>
        <button class="drum-pad">
          C<audio
            class="clip"
            src="./assets/clap.mp3"
            id="C"
          ></audio>
        </button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
